<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Denomination Register</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            color: #000000;
            margin: 0;
            padding: 8px;
        }

        .app-container {
            width: 100%;
            max-width: 100%;
            margin: auto;
            background: #ffffff;
            padding: 10px;
            border: 2px solid #000;
            box-sizing: border-box;
        }

        .header-table, .register-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .header-table td {
            border: 1px solid #000;
            padding: 4px;
        }

        .logo-box {
            width: 110px;
            padding: 6px;
            border-right: 2px solid #000;
            background: #fff;
            text-align: center;
        }

        .logo-box h2 {
            font-size: 18px;
            margin: 0;
        }

        .logo-box span {
            font-size: 10px;
            letter-spacing: 1px;
        }

        .register-title {
            font-size: 13px;
            font-weight: bold;
            text-align: center;
            padding: 6px;
        }

        .branch-select-row select {
            font-size: 14px;
            font-weight: 700;
            width: 100%;
            border: none;
            background: transparent;
            outline: none;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 8px 0;
            font-size: 11px;
        }

        .meta-row input[type="date"], .meta-row input[type="text"] {
            width: 110px;
            padding: 4px;
            font-size: 11px;
            border: 1px solid #000;
        }

        .register-table th, .register-table td {
            border: 1px solid #000;
            padding: 4px;
            vertical-align: middle;
            font-size: 11px;
            text-align: center;
            word-wrap: break-word;
        }

        .th-green {
            background-color: #d1fae5;
            color: #065f46;
            font-weight: bold;
        }

        input[type="number"], input[type="text"].cell-input, select.cell-input {
            width: 100%;
            border: none;
            background: transparent;
            text-align: center;
            font-size: 11px;
            outline: none;
            font-family: 'Inter', sans-serif;
            padding: 2px 0;
            box-sizing: border-box;
        }

        input[type="number"]:focus, input[type="text"]:focus {
            background: #fef3c7;
        }

        .add-row-btn {
            background: #10b981;
            color: white;
            border: none;
            padding: 2px 4px;
            font-size: 9px;
            cursor: pointer;
            border-radius: 3px;
            float: right;
        }

        .add-row-btn:hover {
            background: #059669;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 1px 3px;
            font-size: 9px;
            cursor: pointer;
            border-radius: 2px;
        }

        .summary-box {
            margin-top: 10px;
            border: 1px solid #000;
            padding: 8px;
            font-size: 12px;
            background: #f8fafc;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .action-buttons {
            margin-top: 10px;
            text-align: center;
        }

        .action-buttons button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 4px;
        }

        .action-buttons button:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header Section -->
    <table class="header-table">
        <tr>
            <td class="logo-box" rowspan="2">
                <h2>LALITHA</h2>
                <span>NATURALS</span>
            </td>
            <td class="register-title">CASH DENOMINATION REGISTER</td>
        </tr>
        <tr class="branch-select-row">
            <td>
                <select id="branchSelect">
                    <option value="Main Branch">Main Branch</option>
                    <option value="Branch 2">Branch 2</option>
                </select>
            </td>
        </tr>
    </table>

    <!-- Meta Information Row -->
    <div class="meta-row">
        <div>
            <label>Date: </label>
            <input type="date" id="registerDate">
        </div>
        <div>
            <label>Prepared By: </label>
            <input type="text" id="preparedBy" placeholder="Name">
        </div>
    </div>

    <!-- Main Register Table -->
    <table class="register-table" id="mainRegisterTable">
        <thead>
            <tr>
                <th class="th-green" style="width: 15%;">Denomination</th>
                <th class="th-green" style="width: 8%;">No.s</th>
                <th class="th-green" style="width: 10%;">Rs.</th>
                <th class="th-green" style="width: 12%;">Expenses <button type="button" class="add-row-btn" onclick="addDynamicRow('expense')">+Add</button></th>
                <th class="th-green" style="width: 8%;">Amt</th>
                <th class="th-green" style="width: 12%;">Vendor <button type="button" class="add-row-btn" onclick="addDynamicRow('vendor')">+Add</button></th>
                <th class="th-green" style="width: 8%;">Amt</th>
                <th class="th-green" style="width: 12%;">Unbilled <button type="button" class="add-row-btn" onclick="addDynamicRow('unbilled')">+Add</button></th>
                <th class="th-green" style="width: 8%;">Amt</th>
                <th class="th-green" style="width: 7%;">Action</th>
            </tr>
        </thead>
        <tbody id="registerBody">
            <!-- Denomination rows will be dynamically populated via JS -->
        </tbody>
        <tfoot>
            <tr>
                <td class="th-green">Total</td>
                <td class="th-green" id="totalTrayNos">0</td>
                <td class="th-green" id="totalTrayAmt">0.00</td>
                <td class="th-green"></td>
                <td class="th-green" id="totalExpenseAmt">0.00</td>
                <td class="th-green"></td>
                <td class="th-green" id="totalVendorAmt">0.00</td>
                <td class="th-green"></td>
                <td class="th-green" id="totalUnbilledAmt">0.00</td>
                <td class="th-green"></td>
            </tr>
        </tfoot>
    </table>

    <!-- Summary Box -->
    <div class="summary-box">
        <div class="summary-row">
            <span><strong>Total Tray Balance:</strong></span>
            <span id="summaryTray">₹0.00</span>
        </div>
        <div class="summary-row">
            <span><strong>Total Deductions (Expenses + Vendor + Unbilled):</strong></span>
            <span id="summaryDeductions">₹0.00</span>
        </div>
        <div class="summary-row" style="font-size: 14px; border-top: 1px solid #000; padding-top: 4px;">
            <span><strong>Grand Total Accountability:</strong></span>
            <span id="summaryGrandTotal">₹0.00</span>
        </div>
    </div>

    <div class="action-buttons">
        <button type="button" onclick="calculateTotals()">Calculate Totals</button>
    </div>
</div>

<script>
    const denominations = [2000, 500, 200, 100, 50, 20, 10, 5, 2, 1, 'Coins'];

    function initTable() {
        const tbody = document.getElementById('registerBody');
        tbody.innerHTML = '';

        denominations.forEach((denom, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td class="th-green">₹ ${denom}</td>
                <td><input type="number" class="cell-input denom-no" data-denom="${denom}" min="0" oninput="calculateTotals()"></td>
                <td class="denom-rs">0.00</td>
                <td><input type="text" class="cell-input" placeholder="For"></td>
                <td><input type="number" class="cell-input exp-amt" min="0" oninput="calculateTotals()"></td>
                <td><input type="text" class="cell-input" placeholder="Name"></td>
                <td><input type="number" class="cell-input vendor-amt" min="0" oninput="calculateTotals()"></td>
                <td><input type="text" class="cell-input" placeholder="Item"></td>
                <td><input type="number" class="cell-input unbilled-amt" min="0" oninput="calculateTotals()"></td>
                <td>${index === 0 ? '' : '<button type="button" class="delete-btn" onclick="this.closest(\'tr\').remove(); calculateTotals();">X</button>'}</td>
            `;
            tbody.appendChild(row);
        });
        document.getElementById('registerDate').valueAsDate = new Date();
    }

    function addDynamicRow(type) {
        const tbody = document.getElementById('registerBody');
        const row = document.createElement('tr');
        
        let extraFields = '';
        if(type === 'expense') {
            extraFields = `<td></td><td>0.00</td><td><input type="text" class="cell-input" placeholder="For"></td><td><input type="number" class="cell-input exp-amt" min="0" oninput="calculateTotals()"></td><td></td><td>0.00</td><td></td><td>0.00</td>`;
        } else if(type === 'vendor') {
            extraFields = `<td></td><td>0.00</td><td></td><td>0.00</td><td><input type="text" class="cell-input" placeholder="Name"></td><td><input type="number" class="cell-input vendor-amt" min="0" oninput="calculateTotals()"></td><td></td><td>0.00</td>`;
        } else if(type === 'unbilled') {
            extraFields = `<td></td><td>0.00</td><td></td><td>0.00</td><td></td><td>0.00</td><td><input type="text" class="cell-input" placeholder="Item"></td><td><input type="number" class="cell-input unbilled-amt" min="0" oninput="calculateTotals()"></td>`;
        }

        row.innerHTML = `
            <td class="th-green">-</td>
            <td></td><td>0.00</td>
            ${extraFields}
            <td><button type="button" class="delete-btn" onclick="this.closest('tr').remove(); calculateTotals();">X</button></td>
        `;
        tbody.appendChild(row);
    }

    function calculateTotals() {
        let totalNos = 0;
        let totalTrayAmt = 0;
        let totalExp = 0;
        let totalVendor = 0;
        let totalUnbilled = 0;

        document.querySelectorAll('#registerBody tr').forEach(row => {
            const denomText = row.cells[0].innerText.replace('₹ ', '');
            const noInput = row.querySelector('.denom-no');
            const rsCell = row.querySelector('.denom-rs');

            if (noInput && denomText !== '-') {
                const count = parseFloat(noInput.value) || 0;
                const val = denomText === 'Coins' ? 1 : parseFloat(denomText);
                const amt = count * val;
                if(rsCell) rsCell.innerText = amt.toFixed(2);
                
                totalNos += count;
                totalTrayAmt += amt;
            }

            const expInput = row.querySelector('.exp-amt');
            if (expInput) totalExp += parseFloat(expInput.value) || 0;

            const vendorInput = row.querySelector('.vendor-amt');
            if (vendorInput) totalVendor += parseFloat(vendorInput.value) || 0;

            const unbilledInput = row.querySelector('.unbilled-amt');
            if (unbilledInput) totalUnbilled += parseFloat(unbilledInput.value) || 0;
        });

        document.getElementById('totalTrayNos').innerText = totalNos;
        document.getElementById('totalTrayAmt').innerText = totalTrayAmt.toFixed(2);
        document.getElementById('totalExpenseAmt').innerText = totalExp.toFixed(2);
        document.getElementById('totalVendorAmt').innerText = totalVendor.toFixed(2);
        document.getElementById('totalUnbilledAmt').innerText = totalUnbilled.toFixed(2);

        document.getElementById('summaryTray').innerText = `₹${totalTrayAmt.toFixed(2)}`;
        const totalDeductions = totalExp + totalVendor + totalUnbilled;
        document.getElementById('summaryDeductions').innerText = `₹${totalDeductions.toFixed(2)}`;
        document.getElementById('summaryGrandTotal').innerText = `₹${(totalTrayAmt + totalDeductions).toFixed(2)}`;
    }

    window.onload = initTable;
</script>

</body>
</html>
